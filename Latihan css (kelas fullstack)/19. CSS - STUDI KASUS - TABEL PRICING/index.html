<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Price Tiers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel pricing-table">
      <div class="pricing-plan">
        <img src="images/image1.jpg" alt="" class="pricing-img" />
        <h2 class="pricing-header">Personal</h2>
        <ul class="pricing-features">
          <li class="pricing-features-item">Custom domains</li>
          <li class="pricing-features-item">
            Sleeps after 30 mins of inactivity
          </li>
        </ul>
      </div>
      <span class="pricing-price">Free</span>
      <a href="#" class="pricing-buttton">Sign up</a>

      <div class="pricing-plan">
        <img src="images/image2.jpg" alt="" class="pricing-img" />
        <h2 class="pricing-header">Small team</h2>
        <ul class="pricing-features">
          <li class="pricing-features-item">Never Sleeps</li>
          <li class="pricing-features-item">
            Multiple Workers For More Powerful Apps
          </li>
        </ul>
      </div>
      <span class="pricing-price">Rp.150.000</span>
      <a href="#" class="pricing-buttton">Free Trial</a>

      <div class="pricing-plan">
        <img src="images/image2.jpg" alt="" class="pricing-img" />
        <h2 class="pricing-header">Enterprise</h2>
        <ul class="pricing-features">
          <li class="pricing-features-item">Dedicated</li>
          <li class="pricing-features-item">Simpel Horizontal</li>
        </ul>
      </div>
      <span class="pricing-price">Rp.150.000</span>
      <a href="#" class="pricing-buttton">Free Trial</a>
    </div>
  </body>
</html>
